name: Tests

# Gates changes. Deliberately NOT wired into build.yml: a test failure must
# never block the daily build, because a slate's pregame snapshot cannot be
# recreated after tip.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt pytest
      - run: python validate_data_files.py
      - run: python -m pytest tests/ -q
