name: Tests

# Gates changes. Deliberately NOT wired into build.yml: a test failure must
# never block the daily build, because a slate's pregame snapshot cannot be
# recreated after tip.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04  # Playwright 1.56 has no chromium build for ubuntu-latest (26.04)
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt pytest
      - run: python validate_data_files.py
      - run: python -m pytest tests/ -q
      - name: Install public UI browser checks
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Verify public desktop and mobile UI
        run: python research/check_public_ui.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-ui-review
          path: diagnostics/public_ui/
          if-no-files-found: ignore
