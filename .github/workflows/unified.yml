name: Unified model (v8)

# Research only: the v8 candidate, one rating and one pair of logits from
# opening night to the last game, against the production routing (abstain at
# game 0, the early logit for games 1-9, the v6 logits from game 10),
# walk-forward on every test season and against the close on the priced
# seasons (research/unified.py). Writes nothing to the repo; results are the
# job summary and an artifact. The push trigger runs it from the research
# branch before it exists on main.

on:
  workflow_dispatch:
    inputs:
      seasons:
        description: 'Test seasons (BBR years; 2026 = 2025-26)'
        default: '2017-2019 2021-2026'
  push:
    branches: [claude/great-goodall-ulc2wo]
    paths: [research/unified.py, .github/workflows/unified.yml]

permissions:
  contents: read

jobs:
  unified:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: bbr_cache
          key: bbr-${{ github.run_id }}
          restore-keys: bbr-
      # Box scores before 2026-27 are committed (data/nba_box_<y>.csv); the
      # cache holds the preseason box scores (box_pre_<y>.csv) after one run.
      - uses: actions/cache@v4
        with:
          path: research/output/box_*.csv
          key: espn-box-${{ github.run_id }}
          restore-keys: espn-box-
      - uses: actions/cache@v4
        with:
          path: |
            research/output/injury_reports
            research/output/tips_*.csv
          key: injury-reports-${{ github.run_id }}
          restore-keys: injury-reports-
      - name: Download (cached pages are skipped)
        run: python nba_composite.py download --years 2015-2026
      - name: Unified model
        run: |
          set -o pipefail
          python research/unified.py --seasons $(python -c "import nba_composite as nc, sys; print(*nc.parse_years(sys.argv[1:]))" ${{ inputs.seasons || '2017-2019 2021-2026' }}) | tee unified.txt
          { echo '```'; sed -n '/^v8 candidate/,$p' unified.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified
          path: diagnostics/unified/
