name: Kalshi probe

# Prints Kalshi NBA market payloads (research/kalshi_probe.py). Writes nothing.
on:
  workflow_dispatch:
  pull_request:
    paths: ['research/kalshi_probe.py', '.github/workflows/kalshi-probe.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python research/kalshi_probe.py
