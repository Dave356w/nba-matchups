name: Backfill history

# Leave-one-season-out reconstruction of completed seasons, priced at the
# historical DraftKings close from ESPN. Writes data/nba_reconstructed.csv
# (basis=reconstructed). Hindsight analysis, shown separately from native rows.

on:
  workflow_dispatch:
    inputs:
      seasons:
        description: 'Seasons to reconstruct (BBR years; 2026 = 2025-26)'
        default: '2025 2026'

# Its own queue, not site-build: GitHub keeps one *pending* run per group,
# so a pending run here was cancelled whenever the hourly build queued.
# Different files from the build (and from each other), so commits rebase
# cleanly; the push below retries like the build's.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: bbr_cache
          key: bbr-${{ github.run_id }}
          restore-keys: bbr-
      - name: Download seasons and logs
        run: python nba_composite.py download --years 2015-2019 2021-2026
      - name: Reconstruct
        run: python backfill_history.py --seasons ${{ inputs.seasons }}
      - run: python validate_data_files.py
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "reconstructed history ${{ inputs.seasons }}"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((2**i))
          done
          echo "::error::reconstructed history push failed"; exit 1
