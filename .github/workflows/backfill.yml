name: Backfill history

# Leave-one-season-out reconstruction of completed seasons, priced at the
# historical DraftKings close from ESPN. Writes data/nba_reconstructed.csv
# (basis=reconstructed). Hindsight analysis, shown separately from native rows.

on:
  workflow_dispatch:
    inputs:
      seasons:
        description: 'Seasons to reconstruct (BBR years; 2026 = 2025-26)'
        default: '2025 2026'
      rescore:
        description: 'Only re-score existing rows with the current model (keep prices/results)'
        type: boolean
        default: true
      rebuild:
        description: 'Season in progress (e.g. 2027): rebuild its played games with the current model into data/nba_rebuilt.csv (rescore off)'
        type: boolean
        default: false

# Its own queue, not site-build: GitHub keeps one *pending* run per group,
# so a pending run here was cancelled whenever the hourly build queued.
# Different files from the build (and from each other), so commits rebase
# cleanly; the push below retries like the build's.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: bbr_cache
          key: bbr-${{ github.run_id }}
          restore-keys: bbr-
      # ESPN box scores, tip times and NBA injury reports for the v4
      # availability arm (shared with the research and fit workflows).
      - uses: actions/cache@v4
        with:
          path: research/output/box_*.csv
          key: espn-box-${{ github.run_id }}
          restore-keys: espn-box-
      - uses: actions/cache@v4
        with:
          path: |
            research/output/injury_reports
            research/output/tips_*.csv
          key: injury-reports-${{ github.run_id }}
          restore-keys: injury-reports-
      - name: Download seasons and logs
        # 2020: the season before 2021 (last season in the v8 rating)
        run: python nba_composite.py download --years 2015-2026
      - name: Refresh the season in progress
        if: ${{ inputs.rebuild }}
        # its season page and logs change daily: refetch them
        run: python nba_composite.py download --years ${{ inputs.seasons }} --refresh
      - name: Reconstruct
        if: ${{ !inputs.rebuild }}
        run: python backfill_history.py --seasons ${{ inputs.seasons }} ${{ inputs.rescore && '--rescore' || '' }}
      - name: Rebuild the season in progress
        if: ${{ inputs.rebuild }}
        run: python backfill_history.py --seasons ${{ inputs.seasons }} --rebuild
      - name: Post-rescore model checks
        if: ${{ inputs.rescore && !inputs.rebuild }}
        run: |
          python research/model_review.py
          python research/dk_hypotheses.py
      - run: python validate_data_files.py
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # data/ plus the post-rescore review outputs, so the rebase below
          # never meets unstaged generated files
          git add data/
          ${{ inputs.rescore && !inputs.rebuild && 'git add diagnostics/model_review/ diagnostics/dk_hypotheses/' || '' }}
          git diff --cached --quiet && exit 0
          git commit -m "${{ inputs.rebuild && 'rebuilt season' || 'reconstructed history' }} ${{ inputs.seasons }}"
          for i in 1 2 3 4; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep $((2**i))
          done
          echo "::error::reconstructed history push failed"; exit 1
