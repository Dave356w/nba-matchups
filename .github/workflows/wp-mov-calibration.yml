name: WP to MOV calibration

on:
  workflow_dispatch:
  push:
    # Reuse the history-backtest ref: Actions caches are scoped by ref.
    branches: [claude/bold-gates-5nks87]
    paths:
      - research/wp_mov_calibration.py
      - tests/test_wp_mov_calibration.py
      - .github/workflows/wp-mov-calibration.yml

permissions:
  contents: read

concurrency:
  group: wp-mov-calibration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest tests/test_wp_mov_calibration.py tests/test_history_backtest.py -q
      - uses: actions/cache@v4
        with:
          path: bbr_cache
          key: bbr-${{ github.run_id }}
          restore-keys: bbr-
      - uses: actions/cache@v4
        with:
          path: research/output/box_*.csv
          key: espn-box-${{ github.run_id }}
          restore-keys: espn-box-
      - uses: actions/cache@v4
        with:
          path: |
            research/output/injury_reports
            research/output/tips_*.csv
          key: injury-reports-${{ github.run_id }}
          restore-keys: injury-reports-
      - name: Rebuild walk-forward probabilities and test margin mappings
        run: |
          set -o pipefail
          python research/wp_mov_calibration.py | tee wp_mov_calibration.txt
      - name: Summary
        if: always()
        run: |
          if test -f diagnostics/wp_mov_calibration/REPORT.md; then
            cat diagnostics/wp_mov_calibration/REPORT.md >> "$GITHUB_STEP_SUMMARY"
          else
            tail -n 60 wp_mov_calibration.txt >> "$GITHUB_STEP_SUMMARY" || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wp-mov-calibration
          path: |
            wp_mov_calibration.txt
            diagnostics/wp_mov_calibration/
