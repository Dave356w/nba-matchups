name: Open vs close

# Research only: is the model's opening-price signal real, or injury-report
# timing? Scores each season walk-forward with the shipped routing (v4) and
# with no injury-report terms (base), and compares both at the open and the
# close on the same games, plus the pre-registered cells H1-H3
# (research/open_price.py, CLAUDE.md). Writes nothing to the repo; results
# are the job summary and an artifact.

on:
  workflow_dispatch:
    inputs:
      seasons:
        description: 'Test seasons (BBR years; 2026 = 2025-26)'
        default: '2025 2026'

permissions:
  contents: read

jobs:
  open-price:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: bbr_cache
          key: bbr-${{ github.run_id }}
          restore-keys: bbr-
      # ESPN box scores, tip times and NBA injury reports for the v4 arm
      # (shared with the backfill, research and fit workflows).
      - uses: actions/cache@v4
        with:
          path: research/output/box_*.csv
          key: espn-box-${{ github.run_id }}
          restore-keys: espn-box-
      - uses: actions/cache@v4
        with:
          path: |
            research/output/injury_reports
            research/output/tips_*.csv
          key: injury-reports-${{ github.run_id }}
          restore-keys: injury-reports-
      - name: Download (cached pages are skipped)
        run: python nba_composite.py download --years 2015-2019 2021-2026
      - name: Run open vs close
        run: |
          set -o pipefail
          python research/open_price.py --seasons ${{ inputs.seasons }} | tee open_price.txt
          { echo '```'; cat open_price.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: open-price
          path: |
            open_price.txt
            research/output/open_price.csv
