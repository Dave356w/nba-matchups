name: Walk-forward backtest

# Research only: re-scores reconstructed seasons with every fit trained on
# EARLIER seasons only -- the shipped v4 routing (early carryover, base v4,
# availability v4 on report-covered games, base fallback) and the pre-v4
# base -- plus a possession-based pace arm, and compares with
# the leave-one-season-out rows and the close on the same games
# (research/walk_forward.py). Writes nothing to the repo; results are the
# job summary and an artifact.

on:
  workflow_dispatch:
    inputs:
      seasons:
        description: 'Test seasons (BBR years; 2026 = 2025-26)'
        default: '2025 2026'
      game_years:
        description: 'Logit seasons (only those before each test season are used)'
        default: '2023-2026'
      flags:
        description: 'Extra flags, e.g. --no-pace; drop --avail to skip injury reports'
        default: '--avail'
        required: false

permissions:
  contents: read

jobs:
  walk-forward:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: bbr_cache
          key: bbr-${{ github.run_id }}
          restore-keys: bbr-
      # ESPN box scores, tip times and NBA injury reports for the --avail
      # production arm (shared with the backfill, research and fit workflows).
      - uses: actions/cache@v4
        with:
          path: research/output/box_*.csv
          key: espn-box-${{ github.run_id }}
          restore-keys: espn-box-
      - uses: actions/cache@v4
        with:
          path: |
            research/output/injury_reports
            research/output/tips_*.csv
          key: injury-reports-${{ github.run_id }}
          restore-keys: injury-reports-
      - name: Download (cached pages are skipped)
        run: python nba_composite.py download --years 2015-2019 2021-2026
      - name: Run walk-forward
        run: |
          set -o pipefail
          python research/walk_forward.py --seasons ${{ inputs.seasons }} --game-years ${{ inputs.game_years }} ${{ inputs.flags }} | tee walk_forward.txt
          { echo '```'; cat walk_forward.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: walk-forward
          path: |
            walk_forward.txt
            research/output/
