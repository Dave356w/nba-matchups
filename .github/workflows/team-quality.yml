name: Team quality

# Research only: do 3-point luck regression (1a), schedule strength (1b),
# roster talent (1c), last-season carryover (1d) or late-season incentives
# (2) explain the market's persistent team-level
# correction and improve the model walk-forward, against the close on the
# same games (research/team_quality.py)? Writes nothing to the repo; results
# are the job summary and an artifact.

on:
  workflow_dispatch:
    inputs:
      seasons:
        description: 'Test seasons (BBR years; 2026 = 2025-26)'
        default: '2025 2026'
      phase_years:
        description: 'Logit seasons (only those before each test season are used)'
        default: '2016-2019 2021-2026'

permissions:
  contents: read

jobs:
  team-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: bbr_cache
          key: bbr-${{ github.run_id }}
          restore-keys: bbr-
      # ESPN player box scores for the roster-talent arms (shared cache).
      - uses: actions/cache@v4
        with:
          path: research/output/box_*.csv
          key: espn-box-${{ github.run_id }}
          restore-keys: espn-box-
      # 2020 is the prior season of 2021 (last-season carryover arm).
      - name: Download (cached pages are skipped)
        run: python nba_composite.py download --years 2015-2026
      - name: Run team quality
        run: |
          set -o pipefail
          python research/team_quality.py --seasons ${{ inputs.seasons }} --phase-years ${{ inputs.phase_years }} | tee team_quality.txt
          { echo '```'; cat team_quality.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: team-quality
          path: |
            team_quality.txt
            research/output/team_quality.csv
