name: Calibration shape

# Research only: walk-forward test of whether the model's probabilities are
# too flat at the extremes or late in the season (research/calibration_shape.py):
# base vs delta*|delta|, delta*phase and delta*[Mar+] arms, against the close
# on the same games. Writes nothing to the repo; results are the job summary
# and an artifact.

on:
  workflow_dispatch:
    inputs:
      seasons:
        description: 'Test seasons (BBR years; 2026 = 2025-26)'
        default: '2025 2026'
      game_years:
        description: 'Logit seasons (only those before each test season are used)'
        default: '2016-2019 2021-2026'

permissions:
  contents: read

concurrency:
  group: calibration-shape
  cancel-in-progress: false

jobs:
  calibration-shape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: bbr_cache
          key: bbr-${{ github.run_id }}
          restore-keys: bbr-
      - name: Download (cached pages are skipped)
        run: python nba_composite.py download --years 2015-2019 2021-2026
      - name: Run calibration shape
        run: |
          set -o pipefail
          python research/calibration_shape.py --seasons ${{ inputs.seasons }} --game-years ${{ inputs.game_years }} | tee calibration_shape.txt
          { echo '```'; cat calibration_shape.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibration-shape
          path: |
            calibration_shape.txt
            research/output/
