name: Availability ceiling

# Research only (HINDSIGHT): does knowing who actually played close the gap
# to the close? research/availability.py pulls ESPN box scores (player
# minutes and +/-), builds each team's availability relative to its rating
# window, and compares walk-forward logits with and without it against the
# close on the same games. Writes nothing to the repo; results are the job
# summary and an artifact.

on:
  workflow_dispatch:
    inputs:
      seasons:
        description: 'Test seasons (BBR years; 2026 = 2025-26)'
        default: '2025 2026'
      box_seasons:
        description: 'Box-score seasons (training uses those before each test season)'
        default: '2024 2025 2026'

permissions:
  contents: read

jobs:
  availability:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: bbr_cache
          key: bbr-${{ github.run_id }}
          restore-keys: bbr-
      - uses: actions/cache@v4
        with:
          path: research/output/box_*.csv
          key: espn-box-${{ github.run_id }}
          restore-keys: espn-box-
      - name: Download (cached pages are skipped)
        run: python nba_composite.py download --years 2015-2019 2021-2026
      - name: Run availability ceiling
        run: |
          set -o pipefail
          python research/availability.py --seasons ${{ inputs.seasons }} --box-seasons ${{ inputs.box_seasons }} | tee availability.txt
          { echo '```'; cat availability.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: availability
          path: |
            availability.txt
            research/output/
