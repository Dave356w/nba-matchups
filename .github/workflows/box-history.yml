name: Box-score history

# Research data: ESPN player box scores for earlier seasons, so the
# roster-talent arm of research/team_quality.py trains on the same seasons
# as the base model (research/box_history.py). Seasons already cached are
# skipped; the caches are saved even when the job stops, so a rerun resumes.
# Writes nothing to the repo.

on:
  workflow_dispatch:
    inputs:
      seasons:
        description: 'Seasons to build (BBR years; 2016 = 2015-16)'
        default: '2016-2019 2021-2022'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  box-history:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: research/output/box_*.csv
          key: espn-box-${{ github.run_id }}
          restore-keys: espn-box-
      - uses: actions/cache/restore@v4
        with:
          path: bbr_cache
          key: bbr-${{ github.run_id }}
          restore-keys: bbr-
      - name: Build box-score history
        run: |
          set -o pipefail
          python research/box_history.py --seasons ${{ inputs.seasons }} | tee box_history.txt
          { echo '```'; cat box_history.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: research/output/box_*.csv
          key: espn-box-${{ github.run_id }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: bbr_cache
          key: bbr-${{ github.run_id }}
