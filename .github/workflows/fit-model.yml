name: Fit model

# Preseason refit (report §8): download Basketball-Reference season tables and
# game logs, fit composite weights on completed seasons, fit the logit on the
# game-log seasons, fit the early-season carryover logit (cold_start.py),
# commit model/weights.json, model/logit.json and model/logit_early.json.
# `download` fetches every listed year's season page and 30 game logs:
# ~350 requests at 4 s each (the site allows ~20/min), about 25 minutes.

on:
  workflow_dispatch:
    inputs:
      weight_years:
        description: 'Team-season years for composite weights'
        default: '2015-2019 2021-2026'
      logit_years:
        description: 'Game-log years for the logit'
        default: '2023-2026'

# Its own queue, not site-build: GitHub keeps one *pending* run per group,
# so a pending run here was cancelled whenever the hourly build queued.
# Different files from the build (and from each other), so commits rebase
# cleanly; the push below retries like the build's.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: bbr_cache
          key: bbr-${{ github.run_id }}
          restore-keys: bbr-
      - name: Download
        run: python nba_composite.py download --years ${{ inputs.weight_years }} ${{ inputs.logit_years }}
      - name: Backtest (report reproduction, printed only)
        run: python nba_composite.py backtest --years ${{ inputs.logit_years }} --train-years 2015-2019 2021-2022
      - name: Fit weights and logit
        run: |
          rm -f model/weights.json model/logit.json model/logit_early.json
          python nba_composite.py fit-weights --years ${{ inputs.weight_years }}
          python nba_composite.py fit-logit --years ${{ inputs.logit_years }}
          # v2 early-season (games 1-9) carryover logit; needs the season
          # before the first logit year, which weight_years already downloads.
          python cold_start.py fit --years ${{ inputs.logit_years }}
      - name: Commit model
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model/
          git diff --cached --quiet && exit 0
          git commit -m "model refit $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((2**i))
          done
          echo "::error::model push failed"; exit 1
