name: Fit model

# Preseason refit (report §8): download Basketball-Reference season tables and
# game logs, fit composite weights on completed seasons, fit the v9 base model
# on every game of the game-log seasons and the v9 availability model on the
# covered games 1+ of the injury-report seasons (both on the faded rating,
# nba_composite.fade_v8_games, and fitted on the final margin; the files keep
# their logit*.json names), commit model/weights.json, model/logit.json
# and model/logit_avail.json.
# Historical carryover/v4 fits live under research/legacy_models, never loaded by production.

on:
  workflow_dispatch:
    inputs:
      weight_years:
        description: 'Team-season years for composite weights'
        default: '2015-2019 2021-2026'
      logit_years:
        description: 'Game-log years for the v9 base margin model (every game)'
        default: '2016-2019 2021-2026'
      avail_years:
        description: 'Box-score / injury-report seasons for the v8 availability logit'
        default: '2023-2026'

# Its own queue, not site-build: GitHub keeps one *pending* run per group,
# so a pending run here was cancelled whenever the hourly build queued.
# Different files from the build (and from each other), so commits rebase
# cleanly; the push below retries like the build's.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: bbr_cache
          key: bbr-${{ github.run_id }}
          restore-keys: bbr-
      # ESPN box scores, tip times and NBA injury reports for the v3
      # availability logit (shared with the research workflows' caches).
      # Finished box seasons are read from data/nba_box_<y>.csv first
      # (committed by "Box-score history"); the cache covers any other.
      - uses: actions/cache@v4
        with:
          path: research/output/box_*.csv
          key: espn-box-${{ github.run_id }}
          restore-keys: espn-box-
      - uses: actions/cache@v4
        with:
          path: |
            research/output/injury_reports
            research/output/tips_*.csv
          key: injury-reports-${{ github.run_id }}
          restore-keys: injury-reports-
      - name: Download
        # 2020: the season before 2021 (last season in the v8 rating)
        run: python nba_composite.py download --years ${{ inputs.weight_years }} ${{ inputs.logit_years }} 2020
      - name: Backtest (report reproduction, printed only)
        run: python nba_composite.py backtest --years 2023-2026 --train-years 2015-2019 2021-2022
      - name: Fit weights and logit
        run: |
          rm -f model/weights.json model/logit.json model/logit_early.json
          python nba_composite.py fit-weights --years ${{ inputs.weight_years }}
          # v9: v8's terms (delta, b2b_net, delta * season phase, opponent
          # 3-point luck, roster talent, own FT% gap) on the faded rating, every
          # game from game 0, fitted by least squares on the final margin
          # (MODEL.md "v9"; P = Phi(m / sigma)).
          python nba_composite.py fit-logit --v9 --years ${{ inputs.logit_years }}
      - name: Fit availability model (v9)
        run: |
          # Covered games 1+ of the box-score seasons with an NBA injury report;
          # the first box season needs the BPM table of the season before it.
          rm -f model/logit_avail.json
          python player_availability.py fit --v9 --years ${{ inputs.avail_years }}
      - name: Commit model
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model/
          git diff --cached --quiet && exit 0
          git commit -m "model refit $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((2**i))
          done
          echo "::error::model push failed"; exit 1
