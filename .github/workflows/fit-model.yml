name: Fit model

# Preseason refit (report §8): download Basketball-Reference season tables and
# game logs, fit composite weights on completed seasons, fit the logit on the
# game-log seasons, fit the early-season carryover logit (cold_start.py),
# fit the v4 availability logit (player_availability.py), commit
# model/weights.json, model/logit.json, model/logit_early.json and
# model/logit_avail.json.
# `download` fetches every listed year's season page and 30 game logs:
# ~350 requests at 4 s each (the site allows ~20/min), about 25 minutes.

on:
  workflow_dispatch:
    inputs:
      weight_years:
        description: 'Team-season years for composite weights'
        default: '2015-2019 2021-2026'
      logit_years:
        description: 'Game-log years for the v4 logit (delta, b2b, delta*phase)'
        default: '2016-2019 2021-2026'
      early_years:
        description: 'Game-log years for the games 1-9 carryover logit'
        default: '2023-2026'
      avail_years:
        description: 'Box-score / injury-report seasons for the v4 availability logit'
        default: '2023-2026'

# Its own queue, not site-build: GitHub keeps one *pending* run per group,
# so a pending run here was cancelled whenever the hourly build queued.
# Different files from the build (and from each other), so commits rebase
# cleanly; the push below retries like the build's.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: bbr_cache
          key: bbr-${{ github.run_id }}
          restore-keys: bbr-
      # ESPN box scores, tip times and NBA injury reports for the v3
      # availability logit (shared with the research workflows' caches).
      - uses: actions/cache@v4
        with:
          path: research/output/box_*.csv
          key: espn-box-${{ github.run_id }}
          restore-keys: espn-box-
      - uses: actions/cache@v4
        with:
          path: |
            research/output/injury_reports
            research/output/tips_*.csv
          key: injury-reports-${{ github.run_id }}
          restore-keys: injury-reports-
      - name: Download
        run: python nba_composite.py download --years ${{ inputs.weight_years }} ${{ inputs.logit_years }}
      - name: Backtest (report reproduction, printed only)
        run: python nba_composite.py backtest --years ${{ inputs.early_years }} --train-years 2015-2019 2021-2022
      - name: Fit weights and logit
        run: |
          rm -f model/weights.json model/logit.json model/logit_early.json
          python nba_composite.py fit-weights --years ${{ inputs.weight_years }}
          # v4: delta, b2b_net and delta * season phase (MODEL.md).
          python nba_composite.py fit-logit --phase --years ${{ inputs.logit_years }}
          # Early-season (games 1-9) carryover logit, unchanged from v2; needs
          # the season before the first early year (in weight_years).
          python cold_start.py fit --years ${{ inputs.early_years }}
      - name: Fit availability logit (v4)
        run: |
          # Games 10+ of the box-score seasons with an NBA injury report; the
          # first box season needs the BPM table of the season before it.
          rm -f model/logit_avail.json
          python player_availability.py fit --years ${{ inputs.avail_years }}
      - name: Commit model
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model/
          git diff --cached --quiet && exit 0
          git commit -m "model refit $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((2**i))
          done
          echo "::error::model push failed"; exit 1
