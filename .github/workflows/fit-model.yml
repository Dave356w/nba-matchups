name: Fit model

# Preseason refit (report §8): download Basketball-Reference season tables and
# game logs, fit composite weights on completed seasons, fit the v9 base model
# on every game of the game-log seasons and the v9 availability model on the
# covered games 1+ of the injury-report seasons (both on the faded rating,
# nba_composite.fade_v8_games, and fitted on the final margin; the files keep
# their logit*.json names), commit model/weights.json, model/logit.json
# and model/logit_avail.json.
# Historical carryover/v4 fits live under research/legacy_models, never loaded by production.
# version v10 (CLAUDE.md amendment 2026-10-28): ORB% weights, drafted rookies
# valued by pick, and model/avail_train.csv, the report route's training
# games, which the build refits on before each slate. Running it with v10
# activates v10; run Backfill history (rescore, rebuild) right after.
# version v11 (CLAUDE.md amendment 2026-10-28): v10 plus the Questionable
# play-rate table by lead (q_rates in model/logit_avail.json), which reads the
# NBA reports at six leads before tip (a parallel prefetch, cached). Running it
# with v11 activates v11; the post-change checks follow, as for v10.
# It also refits the totals (O/U) model, model/totals.json (totals.py).

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Model version to fit (v11 / v10 activate the 2026-10-28 amendments)'
        type: choice
        options: [v11, v10, v9]
        default: v11
      weight_years:
        description: 'Team-season years for composite weights'
        default: '2015-2019 2021-2026'
      logit_years:
        description: 'Game-log years for the v9 base margin model (every game)'
        default: '2016-2019 2021-2026'
      avail_years:
        description: 'Box-score / injury-report seasons for the v8 availability logit'
        default: '2023-2026'

# Its own queue, not site-build: GitHub keeps one *pending* run per group,
# so a pending run here was cancelled whenever the hourly build queued.
# Different files from the build (and from each other), so commits rebase
# cleanly; the push below retries like the build's.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: bbr_cache
          key: bbr-${{ github.run_id }}
          restore-keys: bbr-
      # ESPN box scores, tip times and NBA injury reports for the v3
      # availability logit (shared with the research workflows' caches).
      # Finished box seasons are read from data/nba_box_<y>.csv first
      # (committed by "Box-score history"); the cache covers any other.
      - uses: actions/cache@v4
        with:
          path: research/output/box_*.csv
          key: espn-box-${{ github.run_id }}
          restore-keys: espn-box-
      - uses: actions/cache@v4
        with:
          path: |
            research/output/injury_reports
            research/output/tips_*.csv
          key: injury-reports-${{ github.run_id }}
          restore-keys: injury-reports-
      - name: Download
        # 2020: the season before 2021 (last season in the v8 rating)
        run: python nba_composite.py download --years ${{ inputs.weight_years }} ${{ inputs.logit_years }} 2020
      - name: Backtest (report reproduction, printed only)
        run: python nba_composite.py backtest --years 2023-2026 --train-years 2015-2019 2021-2022
      - name: Fit weights and logit
        run: |
          rm -f model/weights.json model/logit.json model/logit_early.json
          python nba_composite.py fit-weights --years ${{ inputs.weight_years }} \
            ${{ inputs.version != 'v9' && '--v10' || '' }}
          # v9: v8's terms (delta, b2b_net, delta * season phase, opponent
          # 3-point luck, roster talent, own FT% gap) on the faded rating, every
          # game from game 0, fitted by least squares on the final margin
          # (MODEL.md "v9"; P = Phi(m / sigma)).
          python nba_composite.py fit-logit --${{ inputs.version }} --years ${{ inputs.logit_years }}
      - name: Fit availability model
        run: |
          # Covered games 1+ of the box-score seasons with an NBA injury report;
          # the first box season needs the BPM table of the season before it.
          rm -f model/logit_avail.json model/avail_train.csv
          # v11 reads its Questionable play-rate table from the research output
          # (player_availability.py q-rates over a complete archive): the NBA's CDN
          # throttles the runner, so it does not download every edition again.
          # v11 with the report-name suffix fix (CLAUDE.md 2026-11-13): the fixed
          # play-rate table, q_rates_sfx.json (q_rates.json is the earlier one).
          python player_availability.py fit --${{ inputs.version }} --years ${{ inputs.avail_years }} \
            ${{ inputs.version == 'v11' && '--split-suffix --q-rates diagnostics/questionable_weight/q_rates_sfx.json' || '' }}
      - name: Fit totals (O/U) model
        id: totals
        # Completed seasons' report terms are read from model/totals_report_terms.csv
        # (written by the first fit that computes them, committed below), so a
        # refit fetches no NBA report unless a season or its inputs changed; the
        # report server throttles GitHub runners. If a fetch still stalls, this
        # step stops at its limit and the other refits are committed anyway
        # (model/totals.json then stays as it was).
        timeout-minutes: 45
        continue-on-error: true
        # CLAUDE.md edge floors and O/U amendment (2026-10-29): the totals
        # fit on the completed game-log seasons (totals.py; 2019-20 left out
        # as in its research), written to model/totals.json. ou2 (CLAUDE.md
        # amendment 2026-11-03): plus the injury-report stage on the report
        # seasons at the 300-minute lead, from the cached report archive and
        # v11's play-rate table in model/logit_avail.json. ou3 (CLAUDE.md
        # amendment 2026-11-06): the fit includes both teams' days of rest,
        # so the first run after it activates ou3's tags and rows.
        # Suffix fix (CLAUDE.md ou3 amendment, 2026-11-13): the report terms match
        # joined suffixes, with the fixed play rates in model/logit_avail.json.
        run: python totals.py fit --years "2017-2019 2021-2026" --report-years "2023-2026" --split-suffix
      - name: Keep fetched injury reports even if a step failed
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            research/output/injury_reports
            research/output/tips_*.csv
          key: injury-reports-${{ github.run_id }}-fit
      - name: Report a failed totals fit
        if: steps.totals.outcome == 'failure'
        run: echo "::warning::Totals fit failed or timed out; model/totals.json was not refitted (see the 'Fit totals' step)."
      - name: Check DFS uncertainty on native pregame errors
        # This is separate from the tracked game model. Failed or thin
        # chronological holdouts update diagnostics and retain the last
        # accepted DFS model. Final boxes share bbr_cache.
        run: python research/dfs_calibration.py
      - name: Commit model
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model/ diagnostics/dfs_calibration/RESULTS.json
          git diff --cached --quiet && exit 0
          git commit -m "model refit $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((2**i))
          done
          echo "::error::model push failed"; exit 1
