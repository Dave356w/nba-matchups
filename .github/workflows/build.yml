name: Build & deploy NBA site

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      date:
        description: 'ET slate date (YYYY-MM-DD); blank = today'
        required: false
  # Times are UTC (GitHub ignores a schedule timezone). 04:17 grades last
  # night and takes the overnight first snapshot. The five-hour lock (CLAUDE.md
  # amendment 2026-10-28) needs a snapshot inside each game's last 5 hours:
  # tips run noon to ~10:30 pm ET, so windows open ~11:00-03:30 UTC. GitHub
  # drops or delays many scheduled runs (about a third ran in October 2026), so the
  # build is attempted every 30 minutes, off the top of the hour. A game's row
  # is written or refreshed only before tip and frozen after, so any run is safe.
  # The 30-minute schedule alone still missed most locks (GitHub created 4 of
  # 33 requested runs on 2026-10-28/29), so watch.yml also dispatches a build
  # at each game's lock window; this schedule stays as an independent path.
  schedule:
    - cron: '17 4 * * *'
    - cron: '13,43 11-23 * * *'
    - cron: '13,43 0-3 * * *'

# One build at a time, queued not cancelled, so ledger commits never interleave.
concurrency:
  group: site-build
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write   # start a lock watch shift (watch.yml)

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # Optional pip-cache restore previously stalled CI at the account
          # egress limit. Install directly; keep the input-data cache below.
      - run: python -m pip install -r requirements.txt

      # Basketball-Reference pages, refetched at most once per ET day.
      - uses: actions/cache@v4
        with:
          path: bbr_cache
          key: bbr-${{ github.run_id }}
          restore-keys: bbr-

      - name: Grade, score slate, render
        run: python build_site.py ${{ inputs.date && format('--date {0}', inputs.date) || '' }}

      # DFS-only uncertainty fitting, once per ET morning after the build
      # has saved grading and today's pregame snapshots. Deferred runs retry
      # on later delivered builds; a rejected fit keeps the last good model.
      # Historical renders never train the live DFS model.
      - name: Refit DFS uncertainty once daily
        id: dfs_refit
        if: ${{ !inputs.date }}
        continue-on-error: true
        timeout-minutes: 3
        run: python research/dfs_calibration.py --daily --github-output "$GITHUB_OUTPUT"

      - name: Render with accepted DFS update
        if: ${{ steps.dfs_refit.outputs.updated == 'true' }}
        run: python build_site.py --render-only

      # Validate and commit even if the render step failed: a pregame row
      # already written to data/ cannot be re-derived after tip (the NFL
      # site's rule). Validation runs inside this step, so a bad file still
      # blocks the commit; the Pages upload below runs only on success, so
      # the last good site stays live.
      - name: Validate and commit ledger
        if: ${{ !cancelled() }}
        run: |
          python validate_data_files.py
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ model/dfs_simulation.json diagnostics/dfs_calibration/RESULTS.json
          if git diff --cached --quiet; then echo "no data changes"; exit 0; fi
          git commit -m "ledger $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((2**i))
          done
          echo "::error::ledger push failed"; exit 1

      # Start a lock watch shift (watch.yml) when today's slate still has a
      # game to lock and no shift is running or queued, so any delivered
      # build covers the rest of the slate's lock windows. Never fails the
      # build.
      - name: Start the lock watcher
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python watch_slate.py --check || exit 0
          busy=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow watch.yml --limit 20 \
                   --json status --jq '[.[] | select(.status != "completed")] | length')
          if [ "$busy" = "0" ]; then
            gh workflow run watch.yml --repo "$GITHUB_REPOSITORY" --ref main
          else
            echo "a lock watch shift is already running or queued"
          fi

      - name: Validate publication boundary
        run: python -c "import build_site; build_site.validate_public_output()"

      - name: Keep internal research workbench
        uses: actions/upload-artifact@v4
        with:
          name: research-workbench
          path: diagnostics/site/
          retention-days: 7

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
