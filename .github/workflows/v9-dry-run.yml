name: v9 dry run

# Before model v9 reaches main: run the production fit (Fit model's steps with
# --v9), the current-season rebuild (Backfill history --rebuild) and a page
# render on this branch, WITHOUT committing anything. The outputs (model
# files, data/nba_rebuilt.csv, public/) are the job summary and an artifact,
# so the shipped path is checked before Fit model / Backfill history write to
# main. Research only; delete with the branch.

on:
  workflow_dispatch:
  push:
    branches: [claude/pensive-bell-0h7sge]
    paths:
      - nba_composite.py
      - player_availability.py
      - backfill_history.py
      - .github/workflows/v9-dry-run.yml

permissions:
  contents: read

concurrency:
  group: v9-dry-run-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest tests/test_v9.py tests/test_v8.py -q
      - uses: actions/cache@v4
        with:
          path: bbr_cache
          key: bbr-${{ github.run_id }}
          restore-keys: bbr-
      - uses: actions/cache@v4
        with:
          path: research/output/box_*.csv
          key: espn-box-${{ github.run_id }}
          restore-keys: espn-box-
      - uses: actions/cache@v4
        with:
          path: |
            research/output/injury_reports
            research/output/tips_*.csv
          key: injury-reports-${{ github.run_id }}
          restore-keys: injury-reports-
      - name: Download (cached pages are skipped)
        run: python nba_composite.py download --years 2015-2026
      - name: Fit v9 (as Fit model does; not committed)
        run: |
          set -o pipefail
          cp model/logit.json /tmp/logit_v8.json; cp model/logit_avail.json /tmp/logit_avail_v8.json
          rm -f model/logit.json model/logit_early.json
          python nba_composite.py fit-weights --years 2015-2019 2021-2026
          python nba_composite.py fit-logit --v9 --years 2016-2019 2021-2026 | tee fit.txt
          rm -f model/logit_avail.json
          python player_availability.py fit --v9 --years 2023-2026 | tee -a fit.txt
          git diff --stat -- model/
      - name: Compare with the research fit and v8 on the same games
        run: |
          python - <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          for name in ("logit.json", "logit_avail.json"):
              m = json.load(open(f"model/{name}"))
              print(f"### model/{name}: link {m.get('link')}, n {m['n_games']}, "
                    f"sigma {m.get('sigma', float('nan')):.2f}, intercept {m['intercept']:+.3f}")
              print("    " + "  ".join(f"{f} {c:+.4f}" for f, c in zip(m['features'], m['coef'])))
          EOF
      - name: Rebuild 2026-27 (as Backfill history --rebuild does; not committed)
        run: |
          set -o pipefail
          python nba_composite.py download --years 2027 --refresh
          python backfill_history.py --seasons 2027 --rebuild | tee rebuild.txt
          python validate_data_files.py
          python - <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import pandas as pd
          r = pd.read_csv("data/nba_rebuilt.csv")
          print(f"### data/nba_rebuilt.csv: {len(r)} rows, tags {r['model_tag'].value_counts().to_dict()}")
          cols = ["slate_date", "away", "home", "gp_home", "gp_away", "p_home", "margin_home",
                  "close_book", "close_home_ml", "close_spread", "home_pts", "away_pts"]
          print("```"); print(r[cols].to_string(index=False)); print("```")
          EOF
      - name: Render the pages with the v9 files and the rebuilt rows
        run: python build_site.py --render-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v9-dry-run
          path: |
            fit.txt
            rebuild.txt
            model/
            data/nba_rebuilt.csv
            public/
